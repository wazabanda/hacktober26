[project]
name = "tracksplit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-ai-slim[google,openai]>=2.64.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
