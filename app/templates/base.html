<!doctype html>
<html lang="en" data-theme="tracksplit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7a66">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b7a66'/%3E%3Cpath d='M10 7v18l2-1 2 1 2-1 2 1 2-1 2 1V7l-2 1-2-1-2 1-2-1-2 1z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>{% block title %}TrackSplit{% endblock %}</title>
  <script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'tracksplit-dark'</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
    /* Teach Tailwind daisyUI's colour names so bg-primary/15, divide-base-300, ring-primary/30 etc. get generated.
       inline + reference: utilities point straight at daisyUI's variables, nothing is re-declared. */
    @theme inline reference {
      --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200);
      --color-base-300: var(--color-base-300); --color-base-content: var(--color-base-content);
      --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
      --color-secondary: var(--color-secondary); --color-secondary-content: var(--color-secondary-content);
      --color-accent: var(--color-accent); --color-accent-content: var(--color-accent-content);
      --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
      --color-info: var(--color-info); --color-info-content: var(--color-info-content);
      --color-success: var(--color-success); --color-success-content: var(--color-success-content);
      --color-warning: var(--color-warning); --color-warning-content: var(--color-warning-content);
      --color-error: var(--color-error); --color-error-content: var(--color-error-content);
    }
  </style>
  <style>
    /* TrackSplit theme: deep teal money-green, copper and gold accents. */
    [data-theme="tracksplit"] {
      color-scheme: light;
      --color-base-100: oklch(100% 0 0);
      --color-base-200: oklch(97.2% 0.009 165);
      --color-base-300: oklch(92.5% 0.014 165);
      --color-base-content: oklch(24% 0.03 200);
      --color-primary: oklch(50% 0.11 172);
      --color-primary-content: oklch(98.5% 0.01 172);
      --color-secondary: oklch(62% 0.15 45);
      --color-secondary-content: oklch(98.5% 0.01 45);
      --color-accent: oklch(81% 0.14 85);
      --color-accent-content: oklch(26% 0.05 85);
      --color-neutral: oklch(27% 0.03 200);
      --color-neutral-content: oklch(97% 0.01 200);
      --color-info: oklch(60% 0.13 240);
      --color-info-content: oklch(98.5% 0.01 240);
      --color-success: oklch(60% 0.14 152);
      --color-success-content: oklch(98.5% 0.01 152);
      --color-warning: oklch(81% 0.15 75);
      --color-warning-content: oklch(28% 0.06 60);
      --color-error: oklch(58% 0.2 25);
      --color-error-content: oklch(98.5% 0.01 25);
      --radius-selector: 1rem; --radius-field: 0.75rem; --radius-box: 1.25rem;
      --size-selector: 0.25rem; --size-field: 0.25rem;
      --border: 1px; --depth: 1; --noise: 0;
    }
    [data-theme="tracksplit-dark"] {
      color-scheme: dark;
      --color-base-100: oklch(23% 0.02 200);
      --color-base-200: oklch(18.5% 0.018 200);
      --color-base-300: oklch(31% 0.02 200);
      --color-base-content: oklch(94% 0.01 180);
      --color-primary: oklch(74% 0.13 172);
      --color-primary-content: oklch(20% 0.04 172);
      --color-secondary: oklch(72% 0.13 50);
      --color-secondary-content: oklch(20% 0.04 50);
      --color-accent: oklch(84% 0.13 85);
      --color-accent-content: oklch(24% 0.05 85);
      --color-neutral: oklch(35% 0.02 200);
      --color-neutral-content: oklch(94% 0.01 200);
      --color-info: oklch(72% 0.12 240);
      --color-info-content: oklch(20% 0.04 240);
      --color-success: oklch(74% 0.14 152);
      --color-success-content: oklch(20% 0.04 152);
      --color-warning: oklch(83% 0.14 80);
      --color-warning-content: oklch(24% 0.05 70);
      --color-error: oklch(70% 0.17 25);
      --color-error-content: oklch(20% 0.04 25);
      --radius-selector: 1rem; --radius-field: 0.75rem; --radius-box: 1.25rem;
      --size-selector: 0.25rem; --size-field: 0.25rem;
      --border: 1px; --depth: 1; --noise: 0;
    }
    [x-cloak]{display:none!important}
    html{-webkit-tap-highlight-color:transparent}
    body{-webkit-font-smoothing:antialiased}
    .num{font-variant-numeric:tabular-nums}
    .ts-glow{background:
      radial-gradient(60rem 28rem at 110% -10%, color-mix(in oklch, var(--color-primary) 16%, transparent), transparent 60%),
      radial-gradient(40rem 22rem at -20% 0%, color-mix(in oklch, var(--color-accent) 14%, transparent), transparent 60%),
      var(--color-base-200)}
    .ts-hero{background:
      radial-gradient(22rem 14rem at 100% 0%, color-mix(in oklch, var(--color-primary) 55%, transparent), transparent 70%),
      radial-gradient(18rem 12rem at 0% 110%, color-mix(in oklch, var(--color-accent) 28%, transparent), transparent 70%),
      var(--color-neutral)}
    .ts-hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      box-shadow:inset 0 1px 0 rgb(255 255 255/.12)}
    @keyframes ts-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .ts-in{animation:ts-in .3s ease-out backwards}  /* backwards, not both: a lingering transform traps position:fixed children */
    /* list items rise in one after another; set --i on each */
    .ts-rise{animation:ts-in .45s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0) * 60ms)}
    /* re-runs whenever the class is (re)applied, e.g. a chip becoming "mine" */
    @keyframes ts-pop{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
    .ts-pop{animation:ts-pop .32s cubic-bezier(.22,1,.36,1)}
    @media (prefers-reduced-motion: reduce){.ts-in,.ts-rise,.ts-pop{animation:none}}
  </style>
</head>
<body class="min-h-dvh bg-base-200 text-base-content">
  {% block body %}{% endblock %}
</body>
</html>
