{% extends "base.html" %}
{% block title %}TrackSplit · New split{% endblock %}
{% block body %}
<script src="/static/app.js?v={{ static_v }}"></script>
<div x-data="newSplit()" class="max-w-md mx-auto px-4 pt-3 pb-32 space-y-4">
  <div class="flex items-center gap-2 -ml-2">
    <a href="/" class="btn btn-ghost btn-sm btn-square" aria-label="Back">{{ icon("arrow-left") }}</a>
    <h1 class="text-xl font-extrabold tracking-tight">Split a bill</h1>
    <button x-show="items.length" x-cloak class="btn btn-ghost btn-sm ml-auto text-base-content/60"
            @click="items = []; unreadable = []; error = ''; merchant = ''">Start over</button>
  </div>

  <div class="space-y-3 ts-in" x-show="!items.length && !loading">
    <!-- capture opens the rear camera straight away on phones; the gallery button has no capture so it opens photos -->
    <label class="group block cursor-pointer rounded-box border-2 border-dashed border-primary/35 bg-base-100 hover:border-primary hover:bg-primary/5 transition p-7 text-center">
      <span class="mx-auto size-16 rounded-2xl bg-primary text-primary-content grid place-items-center shadow-lg shadow-primary/25 transition group-hover:scale-105">{{ icon("camera", "size-7") }}</span>
      <span class="block mt-4 font-bold text-lg">Take a photo of the bill</span>
      <span class="block mt-1 text-sm text-base-content/60">Gemini reads every line. You check it before anyone sees it.</span>
      <input type="file" accept="image/*" capture="environment" class="hidden" @change="upload($event)">
    </label>
    <label class="btn btn-outline btn-block gap-2 bg-base-100">
      {{ icon("image") }} Choose from gallery
      <input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" class="hidden" @change="upload($event)">
    </label>
    <button class="btn btn-ghost btn-sm btn-block text-base-content/60" @click="items = [{name: '', qty: 1, line_total: ''}]">or type it in</button>
  </div>

  <div class="card bg-base-100 border border-base-300" x-show="loading" x-cloak>
    <div class="card-body p-5 gap-4">
      <div class="flex items-center gap-3">
        <span class="loading loading-spinner text-primary"></span>
        <div>
          <div class="font-semibold">Reading your bill…</div>
          <div class="text-xs text-base-content/60">Matching items, tax and totals</div>
        </div>
      </div>
      <div class="space-y-2.5">
        <div class="skeleton h-4 w-5/6"></div><div class="skeleton h-4 w-2/3"></div>
        <div class="skeleton h-4 w-3/4"></div><div class="skeleton h-4 w-1/2"></div>
      </div>
    </div>
  </div>

  <div role="alert" class="alert alert-error alert-soft" x-show="error" x-cloak>{{ icon("triangle-alert") }}<span x-text="error"></span></div>
  <div role="alert" class="alert alert-warning alert-soft text-sm" x-show="unreadable.length" x-cloak>
    {{ icon("triangle-alert") }}<div><b>Couldn't read:</b> <span x-text="unreadable.join('; ')"></span></div>
  </div>

  <template x-if="items.length">
    <div class="space-y-4 ts-in">
      <section class="card bg-base-100 border border-base-300">
        <div class="card-body p-4 gap-3">
          <input class="input input-ghost text-lg font-bold px-1 w-full focus:bg-base-200" x-model="merchant" placeholder="Restaurant name" aria-label="Restaurant name">
          <div class="grid grid-cols-[1fr_3rem_5.5rem_1.75rem] gap-1.5 text-[11px] font-semibold uppercase tracking-wide text-base-content/50 px-1">
            <span>Item</span><span class="text-center">Qty</span><span class="text-right">Total</span><span></span>
          </div>
          <template x-for="(it, i) in items" :key="i">
            <div class="grid grid-cols-[1fr_3rem_5.5rem_1.75rem] gap-1.5 items-center">
              <input class="input input-sm" x-model="it.name" placeholder="Item" aria-label="Item name">
              <input class="input input-sm px-1 text-center num" type="number" min="1" inputmode="numeric" x-model.number="it.qty" aria-label="Quantity">
              <input class="input input-sm px-2 text-right num" type="number" step="0.01" inputmode="decimal" x-model="it.line_total" aria-label="Line total">
              <button class="btn btn-ghost btn-xs btn-square text-base-content/50 hover:text-error" @click="items.splice(i, 1)" aria-label="Remove item">{{ icon("x", "size-4") }}</button>
            </div>
          </template>
          <button class="btn btn-ghost btn-sm gap-1 self-start text-primary" @click="items.push({name: '', qty: 1, line_total: ''})">{{ icon("plus", "size-4") }} Add item</button>
        </div>
      </section>

      <section class="card bg-base-100 border border-base-300">
        <div class="card-body p-4 gap-3 text-sm">
          <div class="flex justify-between text-base-content/70"><span>Items sum</span><span class="num font-medium text-base-content" x-text="k(linesMinor())"></span></div>
          <div class="flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 flex-wrap">
              <label for="tax" class="text-base-content/70">Tax / VAT</label>
              <label class="flex items-center gap-1.5 text-xs text-base-content/60 cursor-pointer">
                <input type="checkbox" class="checkbox checkbox-xs checkbox-primary" x-model="tax_included"> incl. in prices
              </label>
            </div>
            <input id="tax" class="input input-sm w-28 text-right num" type="number" step="0.01" inputmode="decimal" x-model="tax">
          </div>
          <label class="flex justify-between items-center"><span class="text-base-content/70">Service</span>
            <input class="input input-sm w-28 text-right num" type="number" step="0.01" inputmode="decimal" x-model="service"></label>
          <label class="flex justify-between items-center"><span class="text-base-content/70">Tip (added)</span>
            <input class="input input-sm w-28 text-right num" type="number" step="0.01" inputmode="decimal" x-model="tip"></label>
          <div class="border-t border-base-300 pt-3 flex justify-between items-center">
            <label for="bill-total" class="font-bold text-base">Bill total</label>
            <input id="bill-total" class="input w-32 text-right font-bold text-base num" type="number" step="0.01" inputmode="decimal" x-model="total">
          </div>
          <div class="flex justify-end">
            <span class="badge gap-1" :class="check().ok ? 'badge-success badge-soft' : 'badge-warning badge-soft'">
              <span x-show="check().ok">{{ icon("check", "size-3.5") }}</span><span x-show="!check().ok">{{ icon("triangle-alert", "size-3.5") }}</span>
              <span x-text="check().text"></span></span>
          </div>
        </div>
      </section>

      <section class="card bg-base-100 border border-base-300">
        <div class="card-body p-4 gap-3">
          <label class="flex flex-col gap-1.5">
            <span class="text-sm font-semibold">Your name</span>
            <input class="input w-full" x-model="host_name" placeholder="e.g. Mwila" maxlength="40">
          </label>
          <div>
            <div class="text-sm font-semibold mb-1.5">Money goes to</div>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer rounded-field border p-3 transition"
                     :class="payee === 'host' ? 'border-primary bg-primary/8 ring-1 ring-primary' : 'border-base-300 hover:border-base-content/30'">
                <input type="radio" class="sr-only" value="host" x-model="payee">
                <span class="flex items-center gap-1.5 font-semibold text-sm">{{ icon("wallet", "size-4") }} My wallet</span>
                <span class="block text-xs text-base-content/60 mt-1">You already paid; friends pay you back.</span>
              </label>
              <label class="cursor-pointer rounded-field border p-3 transition"
                     :class="payee === 'business' ? 'border-primary bg-primary/8 ring-1 ring-primary' : 'border-base-300 hover:border-base-content/30'">
                <input type="radio" class="sr-only" value="business" x-model="payee">
                <span class="flex items-center gap-1.5 font-semibold text-sm">{{ icon("store", "size-4") }} Business</span>
                <span class="block text-xs text-base-content/60 mt-1">Not paid yet; everyone pays the restaurant.</span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <div class="fixed bottom-0 inset-x-0 z-20">
        <div class="max-w-md mx-auto bg-base-100/90 backdrop-blur border-t border-base-300 p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
          <button class="btn btn-primary btn-block btn-lg shadow-lg shadow-primary/25" :disabled="busy || !host_name.trim()" @click="create()">
            <span x-show="busy" class="loading loading-spinner"></span>
            <span x-text="host_name.trim() ? 'Create split' : 'Add your name to continue'"></span>
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
async function shrink(file, max = 1600) {
  // Phones shoot 4000px photos; Gemini reads 1600px fine and it uploads fast.
  try {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
  } catch { return file; }
}

function newSplit() {
  return {
    items: [], merchant: '', tax: '0', tax_included: false, service: '0', tip: '0', total: '', unreadable: [],
    host_name: localStorage.getItem('ts:name') || '', payee: 'host', loading: false, busy: false, error: '',
    async upload(e) {
      const f = e.target.files[0];
      if (!f) return;
      this.loading = true; this.error = '';
      try {
        const fd = new FormData();
        fd.append('file', await shrink(f), 'bill.jpg');
        const r = await fetch('/api/extract/receipt', { method: 'POST', body: fd });
        const j = await r.json();
        if (!r.ok) throw new Error(j.detail || 'Extraction failed');
        Object.assign(this, {
          merchant: j.merchant || '', tax: j.tax, service: j.service, total: j.total, tax_included: j.tax_included,
          unreadable: j.unreadable || [], items: j.items.map((i) => ({ name: i.name, qty: i.qty, line_total: i.line_total })),
        });
      } catch (err) {
        this.error = err.message;
        this.items = [{ name: '', qty: 1, line_total: '' }];
      } finally { this.loading = false; e.target.value = ''; }
    },
    m(v) { return Math.round(parseFloat(v || 0) * 100) || 0; },
    linesMinor() { return this.items.reduce((a, i) => a + this.m(i.line_total), 0); },
    check() {
      const exp = this.linesMinor() + this.m(this.service) + (this.tax_included ? 0 : this.m(this.tax));
      const tot = this.m(this.total);
      if (!tot) return { ok: false, text: 'enter the bill total' };
      const diff = tot - exp;
      return Math.abs(diff) <= Math.max(100, tot / 100)
        ? { ok: true, text: 'lines match total' }
        : { ok: false, text: `lines ${diff > 0 ? 'short' : 'over'} by ${k(Math.abs(diff))}` };
    },
    async create() {
      this.busy = true; this.error = '';
      localStorage.setItem('ts:name', this.host_name);
      try {
        const r = await post('/api/splits', {
          host_name: this.host_name, payee: this.payee, merchant: this.merchant || null,
          items: this.items.filter((i) => i.name && i.line_total !== '').map((i) => ({ name: i.name, qty: i.qty || 1, line_total: String(i.line_total) })),
          tax: String(this.tax || 0), tax_included: this.tax_included, service: String(this.service || 0),
          tip: String(this.tip || 0), total: String(this.total || (this.linesMinor() / 100)),
        });
        localStorage.setItem(`ts:${r.slug}:host`, r.token);
        location.href = `/s/${r.slug}/host`;
      } catch (err) { this.error = err.message; this.busy = false; }
    },
  };
}
</script>
{% endblock %}
